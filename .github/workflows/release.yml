# Builds binaries and uploads them to a GitHub release when a v* tag is pushed.
name: Publish release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Create release
        id: create-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
  build:
    name: Build release binaries
    runs-on: ${{ matrix.runner-os }}
    needs: create-release
    strategy:
      matrix:
        include:
          # Match Go/cmgr convention for suffixes. Each binary is built natively
          # on a runner of the target architecture.
          - runner-os: ubuntu-24.04
            binary-suffix: "linux_amd64"
          - runner-os: ubuntu-24.04-arm
            binary-suffix: "linux_arm64"
          - runner-os: macos-latest
            binary-suffix: "darwin_arm64"
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: false
          rustflags: ""
      - name: Build
        run: |
          cargo build --release
      - name: Create tarball
        run: |
          mkdir out
          cp target/release/cmgr-artifact-server out/
          cp README.md LICENSE-APACHE LICENSE-MIT CHANGELOG.md out/
          cd out && tar czf cmgr-artifact-server_${suffix}.tar.gz *
        env:
          suffix: ${{ matrix.binary-suffix }}
      - name: Upload tarball
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/*.tar.gz
